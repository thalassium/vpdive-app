    <script>
      // Theme before first paint (no flash): saved choice, else the device setting.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) {
            document.documentElement.classList.add('dark');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#080e1f');
          }
        } catch (e) {}
      })();
    </script>
  </head>
