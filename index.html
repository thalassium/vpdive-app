<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#012362" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Gabian · Septentrion Environnement</title>
    <meta name="description" content="Gabian, l’appli des sorties de Septentrion Environnement : agenda, inscriptions VPDive, palanquées. Pointe Rouge, Marseille." />
    <meta property="og:title" content="Gabian · Septentrion Environnement" />
    <meta property="og:description" content="Gabian, l’appli des sorties de Septentrion Environnement : agenda, inscriptions VPDive, palanquées. Pointe Rouge, Marseille." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Police auto-hébergée (public/fonts, @font-face dans src/index.css) : le sous-ensemble latin sert à presque tout le texte. -->
    <link rel="preload" href="/fonts/atkinson-hyperlegible-next-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Theme before first paint (no flash): saved choice, else the device setting,
      // followed live as long as nothing has been saved.
      (function () {
        try {
          var media = matchMedia('(prefers-color-scheme: dark)');
          var apply = function (dark) {
            document.documentElement.classList.toggle('dark', dark);
            document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#080e1f' : '#012362');
          };
          var saved = localStorage.getItem('theme');
          apply(saved ? saved === 'dark' : media.matches);
          media.addEventListener('change', function (e) {
            if (!localStorage.getItem('theme')) apply(e.matches);
          });
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-canvas text-ink font-sans antialiased selection:bg-fill selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
